/*
 * ============================================================================
 * [파일 역할]
 * 루트 모노레포(Monorepo) Gradle 설정 파일 (settings.gradle)
 *
 * [담당 기능]
 * 1. 루트 프로젝트 이름을 'yonsei119'로 정의합니다.
 * 2. 하위 모듈로 'backend' (Java Spring Boot 서버)를 포함시킵니다.
 *    (프론트엔드는 'frontend' 디렉터리에서 정적 웹 자산으로 관리되며,
 *     백엔드 빌드 시 자동으로 JAR 내부 static 리소스로 패키징됩니다.)
 *
 * [수정 시 영향 및 예시]
 * - 새로운 모듈(예: 배치 서버 'batch')을 추가하고 싶다면 아래에 include를 추가합니다.
 *   예시(변경 전):
 *     include 'backend'
 *   예시(변경 후):
 *     include 'backend', 'batch'
 * ============================================================================
 */
rootProject.name = 'yonsei119'
include 'backend'
