# ==============================================================================
# [파일 역할]
# 연세 119 응급실 정보 시스템 - Spring Boot 백엔드 통합 환경 설정 (application.yml)
#
# [담당 기능]
# 1. Render 클라우드 배포 호환 포트(${PORT:8080}) 및 GZIP 압축 설정
# 2. 국립중앙의료원(NEMC) 전국 응급의료정보제공 OpenAPI 엔드포인트 및 인증키 관리
# 3. 네이버 클라우드 플랫폼(NCP) Maps JS v3 / Directions 5 / Directions 15 API 인증키 관리
# 4. 실시간 응급의료 데이터 인메모리 캐시 주기(TTL) 및 HTTP 타임아웃 제어
#
# [보안 및 유지보수 안내]
# - 모든 민감한 API 키는 환경변수(NEMC_API_SERVICE_KEY, NAVER_MAP_CLIENT_ID, NAVER_MAP_CLIENT_SECRET)를
#   최우선으로 읽으며, 로컬 IntelliJ IDEA 개발 편의를 위해 기본값이 지정되어 있습니다.
# - 프론트엔드(app.js)에는 절대 Secret Key가 노출되지 않으며, 백엔드가 안전하게 프록시합니다.
# ==============================================================================

spring:
  application:
    name: yonsei119-backend
  web:
    resources:
      # [기능 설명] 정적 리소스(index.html, app.js, style.css) 캐시 제어
      # [수정 시 영향] 개발 중 코드 변경이 즉시 반영되도록 0초로 설정되어 있습니다.
      cache:
        period: 0

server:
  # [기능 설명] 서버 바인딩 포트 설정 (Render 배포 환경 필수 호환)
  # [수정 시 영향 및 예시]
  # Render는 컨테이너 실행 시 동적으로 PORT 환경변수를 주입합니다.
  # 로컬 IntelliJ에서 8080 포트가 이미 사용 중이어서 9090으로 바꾸고 싶다면:
  #   변경 전: port: ${PORT:8080}
  #   변경 후: port: ${PORT:9090}
  port: ${PORT:8080}

  # [기능 설명] 전국 530여 개 응급의료기관 JSON 응답의 네트워크 전송 속도를 높이기 위한 GZIP 압축
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html,text/xml
    min-response-size: 1024

yonsei119:
  # ----------------------------------------------------------------------------
  # 1. 국립중앙의료원(NEMC) 응급의료정보조회서비스 OpenAPI 설정
  # ----------------------------------------------------------------------------
  nemc:
    # OpenAPI 기본 URL (국립중앙의료원 응급의료정보조회서비스 V13 기준)
    base-url: ${NEMC_API_BASE_URL:https://apis.data.go.kr/B552657/ErmctInfoInqireService}

    # 공공데이터포털 일반 인증키 (URL Encoded 형식 권장, Decoded 형식 입력 시 백엔드가 자동 인코딩 처리)
    service-key: ${NEMC_API_SERVICE_KEY:s%2FvWNiKH1YndVRu2mPOq7OXAIj%2Byk0M3JTgvN%2B8UVdSFPq8SBR7zuUdG3mxklTrj6WYIiUidSIUwgE8bz09fzQ%3D%3D}

    # [기능 설명] 실시간 병원 스냅샷 인메모리 캐시 유효 시간(초)
    # [수정 시 영향 및 예시]
    # 너무 짧게(예: 5초) 설정하면 공공데이터포털 트래픽 한도를 빠르게 소진할 수 있고,
    # 너무 길게(예: 600초) 설정하면 병상 갱신 주기가 느려집니다.
    #   예시(변경 전): cache-ttl-seconds: ${NEMC_CACHE_TTL_SECONDS:45}
    #   예시(변경 후, 2분 주기로 변경): cache-ttl-seconds: ${NEMC_CACHE_TTL_SECONDS:120}
    cache-ttl-seconds: ${NEMC_CACHE_TTL_SECONDS:45}

    # [기능 설명] 공공데이터포털 개별 API 요청 타임아웃(밀리초)
    request-timeout-ms: ${NEMC_REQUEST_TIMEOUT_MS:20000}

  # ----------------------------------------------------------------------------
  # 2. 네이버 클라우드 플랫폼(NCP) 지도 및 자동차 경로 탐색(Directions 5 / 15) 설정
  # ----------------------------------------------------------------------------
  naver:
    # Application 이름: YONSEI-PROJECT
    # X-NCP-APIGW-API-KEY-ID (Web Dynamic Map & Directions 공용 Client ID)
    client-id: ${NAVER_MAP_CLIENT_ID:xfbxloc8km}

    # X-NCP-APIGW-API-KEY (Directions 5 / Directions 15 서버 호출 전용 Client Secret)
    # 주의: 이 값은 백엔드 서버에서만 사용되며 프론트엔드 브라우저로 전달되지 않습니다.
    client-secret: ${NAVER_MAP_CLIENT_SECRET:YwgMcb3rLbfCtBqtLcM53ECu9xuYWScw35MjM8k2}

    # 네이버 Directions 5 API 엔드포인트 (최대 경유지 5곳, 빠른 실시간 경로/예상 소요시간 조회)
    directions5-url: ${NAVER_DIRECTIONS5_URL:https://maps.apigw.ntruss.com/map-direction/v1/driving}

    # 네이버 Directions 15 API 엔드포인트 (최대 경유지 15곳, 다중 경유/광역 경로 탐색 및 소요시간 조회)
    directions15-url: ${NAVER_DIRECTIONS15_URL:https://maps.apigw.ntruss.com/map-direction-15/v1/driving}

  # ----------------------------------------------------------------------------
  # 3. 기본 출발 기준 좌표 (연세대학교 미래캠퍼스)
  # ----------------------------------------------------------------------------
  default-origin:
    # [기능 설명] 웹 앱 최초 실행 시 기본 기준점 좌표 및 라벨
    # [수정 시 영향 및 예시]
    # 초기 중심 좌표를 서울 시청(37.5666805, 126.9784147)으로 바꾸고 싶다면:
    #   lat: 37.5666805
    #   lng: 126.9784147
    #   label: 서울특별시청
    lat: 37.31904016818661
    lng: 127.90122866146605
    label: 연세대학교 미래캠퍼스 (기본 위치)
