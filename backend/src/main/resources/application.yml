# ==============================================================================
# [파일 역할]
# 연세 119 응급실 정보 시스템 - Spring Boot 백엔드 통합 환경 설정 파일 (application.yml)
#
# [파이썬 장고(Django) 비유]
# - 장고 프로젝트의 `settings.py` + `.env` 파일 역할을 동시에 수행하는 핵심 설정 파일입니다!
# - 장고에서 `os.environ.get('NAVER_MAP_CLIENT_ID', '기본값')`처럼 환경변수를 읽듯이,
#   Spring Boot YAML에서는 `${환경변수명:기본값}` 문법으로 환경변수를 우선 읽고 없을 때만 기본값을 씁니다.
#
# [코드의 경로성 (어디서 오고 어디로 가는가?)]
# - [누가 이 파일을 읽는가 (Outgoing 1)] :
#   1) Spring Boot 내장 엔진이 `spring.*`, `server.*` 블록을 읽어 포트(8080)와 GZIP 압축을 자동 설정합니다.
#   2) `Yonsei119Application.java`의 `@ConfigurationPropertiesScan`이 동작하면서,
#      이 파일의 `yonsei119:` 하위 설정들이 **`config/Yonsei119Properties.java`** 레코드 객체로 1:1 자동 주입됩니다!
#      (주의: YAML의 kebab-case 이름인 `cache-ttl-seconds`는 Java의 camelCase 필드명 `cacheTtlSeconds`로 자동 매핑됩니다.)
# - [그 다음 어디로 전달되는가 (Outgoing 2)] :
#   - `yonsei119.nemc.*` → `service/NmcOpenApiClient.java` 및 `service/EmergencyDataService.java`에서 사용
#   - `yonsei119.naver.*` → `controller/EmergencyApiController.java` (`/api/config`) 및 `service/NaverDirectionsService.java`에서 사용
#   - `yonsei119.default-origin.*` → `controller/EmergencyApiController.java` (`/api/config`) → 프론트엔드 `frontend/app.js` 초기 중심점!
#
# [보안 주의사항]
# - `client-secret`은 백엔드(`NaverDirectionsService.java`) 내부 서버 통신에서만 쓰이며,
#   프론트엔드(`FrontendConfigDto.java` → `/api/config`)로는 절대 내려가지 않도록 분리되어 있습니다.
# ==============================================================================

spring:
  application:
    # 애플리케이션 식별 이름 (로그 및 모니터링 표시용)
    name: yonsei119-backend
  config:
    # 로컬 개발 시 Git에 커밋되지 않는 `.env` 또는 `application-local.yml`에서 비밀키를 자동 로드합니다.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:classpath:application-local.yml
  web:
    resources:
      # [기능 설명] 정적 리소스(index.html, app.js, style.css) 브라우저 캐시 유지 시간(초)
      # [수정 시 영향 및 예시]
      # 개발 중 코드 수정이 즉시 브라우저에 반영되도록 `0`으로 두었습니다 (`WebConfig.java`와 함께 동작).
      # 운영 서버에서 1시간(3600초) 캐싱을 켜고 싶다면 아래처럼 변경합니다:
      #   변경 전: period: 0
      #   변경 후: period: 3600
      cache:
        period: 0

server:
  # [기능 설명] 웹 서버 바인딩 포트 설정 (Render 클라우드 배포 환경 필수 호환)
  # [수정 시 영향 및 예시]
  # 로컬 PC에서 8080 포트가 다른 프로그램(예: Django 8000 대신 띄운 다른 서버)과 겹쳐서 9090으로 바꾸고 싶다면:
  #   변경 전: port: ${PORT:8080}
  #   변경 후: port: ${PORT:9090}
  port: ${PORT:8080}

  # [기능 설명] 전국 530여 개 응급의료기관 JSON 응답 및 JS/CSS 전송 용량을 줄여 로딩 속도를 높이는 GZIP 압축 설정
  # [수정 시 영향 및 예시]
  # `min-response-size`보다 큰 응답(기본 1024바이트 = 1KB 이상)을 자동으로 GZIP 압축하여 모바일 데이터와 로딩 시간을 절약합니다.
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html,text/xml
    min-response-size: 1024

yonsei119:
  # ----------------------------------------------------------------------------
  # 1. 국립중앙의료원(NEMC) 응급의료정보조회서비스 OpenAPI 설정
  #    -> 연결되는 Java 코드: Yonsei119Properties.Nemc -> NmcOpenApiClient.java / EmergencyDataService.java
  # ----------------------------------------------------------------------------
  nemc:
    # OpenAPI 기본 URL (`NmcOpenApiClient.java`에서 이 주소 뒤에 `/getEmrrmRltmUsefulSckbdInfoInqire` 등을 붙여 호출)
    base-url: ${NEMC_API_BASE_URL:https://apis.data.go.kr/B552657/ErmctInfoInqireService}

    # 공공데이터포털 일반 인증키 (`NmcOpenApiClient.ensureUrlEncodedServiceKey()`가 Encoded/Decoded 여부를 자동 판별하여 처리)
    # 보안상 소스코드에 평문 시크릿을 두지 않으며, 운영 환경변수(`NEMC_API_SERVICE_KEY`) 또는 로컬 `.env`에서 주입받습니다.
    service-key: ${NEMC_API_SERVICE_KEY:}

    # [기능 설명] 실시간 병원 스냅샷 인메모리 캐시 유효 시간(초, 기본 1200초 = 20분)
    # -> 연결되는 Java 코드: `EmergencyDataService.getSnapshot()`의 캐시 만료 판정 로직
    # [수정 시 영향 및 예시]
    # 너무 짧게(예: 5초) 설정하면 공공데이터포털 일일 트래픽 한도를 소진할 수 있고,
    # 너무 길게 설정하면 백그라운드 병상 갱신이 늦어집니다 (화면의 '새로고침' 버튼 클릭 시에는 캐시를 무시하고 즉시 갱신됨).
    #   예시(변경 전 - 20분): cache-ttl-seconds: ${NEMC_CACHE_TTL_SECONDS:1200}
    #   예시(변경 후 - 5분):  cache-ttl-seconds: ${NEMC_CACHE_TTL_SECONDS:300}
    cache-ttl-seconds: ${NEMC_CACHE_TTL_SECONDS:1200}

    # [기능 설명] 공공데이터포털 개별 API HTTP 요청 최대 대기 시간(밀리초, 기본 25000 = 25초)
    # -> 연결되는 Java 코드: `NmcOpenApiClient.fetchItems()`의 `HttpRequest.timeout(...)`
    request-timeout-ms: ${NEMC_REQUEST_TIMEOUT_MS:25000}

    # [기능 설명] 서버 기동 즉시 사전 로딩(Cache Pre-warming) 및 백그라운드 주기적 자동 갱신 활성화 여부
    # -> 연결되는 Java 코드: `EmergencyDataService.warmUpCacheOnStartup()` 및 `scheduledAutoRefresh()`
    # [수정 시 영향 및 예시]
    # - `true` (기본값): 서버가 켜지자마자 백그라운드에서 전국 병원 데이터를 미리 받아두므로 첫 접속자도 0.1초 만에 지도를 봅니다.
    # - `false`: 첫 사용자가 `/api/hospitals`를 호출할 때 처음 조회합니다 (`Yonsei119BackendTests.java` 테스트 시에는 `false`로 덮어씀).
    auto-refresh-enabled: ${NEMC_AUTO_REFRESH_ENABLED:true}

    # [기능 설명] 백그라운드 스케줄러 자동 갱신 주기(밀리초, 기본 1200000 = 20분)
    # -> 연결되는 Java 코드: `EmergencyDataService.scheduledAutoRefresh()`의 `@Scheduled(fixedDelayString = ...)`
    #   예시(변경 전 - 20분): refresh-interval-ms: ${NEMC_REFRESH_INTERVAL_MS:1200000}
    #   예시(변경 후 - 10분): refresh-interval-ms: ${NEMC_REFRESH_INTERVAL_MS:600000}
    refresh-interval-ms: ${NEMC_REFRESH_INTERVAL_MS:1200000}

  # ----------------------------------------------------------------------------
  # 2. 네이버 클라우드 플랫폼(NCP) 지도 및 자동차 경로 탐색(Directions 5 / 15) 설정
  #    -> 연결되는 Java 코드: Yonsei119Properties.Naver -> EmergencyApiController(/api/config) & NaverDirectionsService.java
  # ----------------------------------------------------------------------------
  naver:
    # NCP Application Client ID (`X-NCP-APIGW-API-KEY-ID`)
    # -> `/api/config` 응답(`ncpKeyId`)으로도 전달되어 `frontend/index.html` 및 `app.js`의 네이버 지도 SDK 인증에 쓰입니다.
    client-id: ${NAVER_MAP_CLIENT_ID:xfbxloc8km}

    # 네이버 지도 Style Editor 다크 모드(야간 관제) Custom Style ID
    # -> `frontend/app.js`의 `DARK_MAP_STYLE_ID` / `mountNaverMap()`에서 다크 모드 벡터 타일 스타일을 입힐 때 사용됩니다.
    # [수정 시 영향 및 예시]
    # 네이버 클라우드 Style Editor에서 새 다크 지도 스타일을 발행받았다면 아래 UUID 문자열만 교체하면 즉시 새 테마 지도가 뜹니다:
    #   변경 전: dark-style-id: ${NAVER_MAP_DARK_STYLE_ID:4b12b380-f70c-4d42-85df-ecf7961ff041}
    #   변경 후: dark-style-id: ${NAVER_MAP_DARK_STYLE_ID:새로-발급받은-스타일-UUID}
    dark-style-id: ${NAVER_MAP_DARK_STYLE_ID:4b12b380-f70c-4d42-85df-ecf7961ff041}

    # NCP Application Client Secret (`X-NCP-APIGW-API-KEY`)
    # -> 오직 백엔드 `NaverDirectionsService.java`에서만 HTTP 헤더에 실어 호출하며, 브라우저로는 절대 노출되지 않습니다.
    # -> 보안상 평문 기본값을 제거하고 운영 환경변수(`NAVER_MAP_CLIENT_SECRET`) 또는 로컬 `.env`에서 주입받습니다.
    client-secret: ${NAVER_MAP_CLIENT_SECRET:}

    # 네이버 Directions 5 API 엔드포인트 (최대 경유지 5곳, 빠른 실시간 경로/예상 소요시간 조회)
    directions5-url: ${NAVER_DIRECTIONS5_URL:https://maps.apigw.ntruss.com/map-direction/v1/driving}

    # 네이버 Directions 15 API 엔드포인트 (최대 경유지 15곳, 다중 경유/광역 경로 탐색)
    directions15-url: ${NAVER_DIRECTIONS15_URL:https://maps.apigw.ntruss.com/map-direction-15/v1/driving}

  # ----------------------------------------------------------------------------
  # 3. 기본 출발 기준 좌표 (연세대학교 미래캠퍼스)
  #    -> 연결되는 코드: Yonsei119Properties.DefaultOrigin -> EmergencyApiController.getConfig() -> frontend/app.js DEFAULT_ORIGIN
  # ----------------------------------------------------------------------------
  default-origin:
    # [기능 설명] 사용자가 위치 권한(GPS)을 허용하기 전이나 초기화 시 사용하는 기본 기준점 좌표 및 명칭입니다.
    # [수정 시 영향 및 예시]
    # 초기 중심 좌표를 연세대 신촌캠퍼스(세브란스병원 인근: 37.5622, 126.9408)로 바꾸고 싶다면:
    #   변경 전:
    #     lat: 37.31904016818661
    #     lng: 127.90122866146605
    #     label: 연세대학교 미래캠퍼스 (기본 위치)
    #   변경 후:
    #     lat: 37.562200
    #     lng: 126.940800
    #     label: 연세대학교 신촌캠퍼스 (기본 위치)
    #   (참고: 프론트엔드 초기값과 완전히 일치시키려면 `frontend/app.js` 상단의 `DEFAULT_ORIGIN` 상수도 함께 맞추는 것을 권장합니다.)
    lat: 37.31904016818661
    lng: 127.90122866146605
    label: 연세대학교 미래캠퍼스 (기본 위치)
